name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_dw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg[binary] python-dotenv boto3
          pip install dbt-core dbt-postgres

      - name: Generate dataset
        run: |
          python src/ingestion/generate_dataset.py

      - name: Create source PostgreSQL tables
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d sales_dw \
            -f scripts/create_source_tables.sql

      - name: Load data into PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sales_dw
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python src/ingestion/load_to_postgres.py

      - name: Create and populate warehouse
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d sales_dw \
            -f scripts/create_warehouse.sql

      - name: dbt debug
        env:
          DBT_DB_HOST: localhost
          DBT_DB_PORT: 5432
          DBT_DB_PASSWORD: postgres
        run: |
          dbt debug \
            --project-dir dbt_project \
            --profiles-dir dbt_project

      - name: dbt run
        env:
          DBT_DB_HOST: localhost
          DBT_DB_PORT: 5432
          DBT_DB_PASSWORD: postgres
        run: |
          dbt run \
            --project-dir dbt_project \
            --profiles-dir dbt_project

      - name: dbt test
        env:
          DBT_DB_HOST: localhost
          DBT_DB_PORT: 5432
          DBT_DB_PASSWORD: postgres
        run: |
          dbt test \
            --project-dir dbt_project \
            --profiles-dir dbt_project
